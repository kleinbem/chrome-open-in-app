<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabs to PWA</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="logo-group">
        <img src="../icons/icon-48.png" alt="Logo" class="app-icon">
        <div>
          <h1 class="app-title">Tabs to PWA</h1>
          <span class="app-subtitle">1-Click App Windows</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="nav-tabs-btn" class="nav-btn active" title="Open Tabs">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="3"></rect>
            <path d="M3 9h18"></path>
          </svg>
        </button>
        <button id="nav-settings-btn" class="nav-btn" title="Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main View: Open Tabs -->
    <main id="view-tabs" class="view active">
      <div class="hero-card">
        <div class="stats-row">
          <div class="stat-item">
            <span id="tab-count" class="stat-number">0</span>
            <span class="stat-label">PWA Tabs Detected</span>
          </div>
          <div class="shortcut-pill" title="Press anytime to move all tabs">
            <span class="key">Alt</span>+<span class="key">Shift</span>+<span class="key">P</span>
          </div>
        </div>

        <button id="btn-move-all" class="btn-primary" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
          <span id="btn-move-all-text">Move All to PWA Windows</span>
        </button>
      </div>

      <div class="tabs-section">
        <div class="section-header">
          <span class="section-title">Eligible Open Tabs</span>
          <label class="scope-toggle">
            <input type="checkbox" id="chk-all-windows">
            <span>All windows</span>
          </label>
        </div>

        <div id="tabs-list" class="tabs-list">
          <!-- Populated dynamically -->
          <div class="loading-state">Scanning open tabs...</div>
        </div>
      </div>
    </main>

    <!-- View: Settings / Domains -->
    <section id="view-settings" class="view">
      <div class="settings-section">
        <h2 class="settings-heading">Google & Web PWAs</h2>
        <p class="settings-desc">Tabs matching enabled domains will automatically be detected.</p>
        <div id="presets-list" class="presets-grid">
          <!-- Populated dynamically -->
        </div>
      </div>

      <div class="settings-section">
        <h2 class="settings-heading">Custom Domains</h2>
        <p class="settings-desc">Add any custom website or self-hosted PWA domain.</p>
        <form id="form-add-custom" class="add-custom-form">
          <input type="text" id="input-custom-domain" placeholder="e.g. app.slack.com" required>
          <button type="submit" class="btn-secondary">Add</button>
        </form>
        <div id="custom-domains-list" class="custom-domains-list">
          <!-- Populated dynamically -->
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="app-footer">
      <span id="status-message">Ready</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
