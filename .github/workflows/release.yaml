name: Package & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package Chrome Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Full Validation
        run: npm run validate

      - name: Extract Version
        id: get_version
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building package for version v$VERSION"

      - name: Create Production Zip for Chrome Web Store
        run: |
          ZIP_NAME="open-in-app-v${{ steps.get_version.outputs.VERSION }}.zip"
          
          # Package strictly the runtime files required by Chrome Web Store
          # Excludes: .git, tests, node_modules, config files, and dev docs
          zip -r "$ZIP_NAME" \
            manifest.json \
            background.js \
            popup \
            icons \
            utils \
            README.md \
            -x "*.DS_Store" "*__tests__*"

          echo "Package created successfully: $ZIP_NAME"
          ls -lh "$ZIP_NAME"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-in-app-v${{ steps.get_version.outputs.VERSION }}
          path: open-in-app-v${{ steps.get_version.outputs.VERSION }}.zip
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: open-in-app-v${{ steps.get_version.outputs.VERSION }}.zip
          name: Release v${{ steps.get_version.outputs.VERSION }}
          generate_release_notes: true
